# Model Configuration for Phase 2 Baselines

project:
  name: "oulad_baselines_phase2"
  random_seed: 42
  tracking_uri: "sqlite:///mlruns.db"

data:
  features_weekly_path: "data/processed/features_weekly.parquet"
  features_manifest_path: "config/features.yaml"
  scaler_path: "models/preprocessing/train_scaler.joblib"
  min_week: 2
  default_k: 3
  drop_never_active: true
  drop_proxy: false

bootstrap:
  n_resamples: 500
  random_seed: 42

models:
  lr:
    solver: "lbfgs"
    max_iter: 1000
    c_grid: [0.001, 0.01, 0.1, 1.0, 10.0]
  lgbm:
    early_stopping_rounds: 50
    n_estimators: 1000
    optuna_trials: 50
    search_space:
      num_leaves: [15, 127]
      max_depth: [4, 10]
      learning_rate: [0.02, 0.1]
      min_child_samples: [50, 500]
      feature_fraction: [0.5, 1.0]
      bagging_fraction: [0.5, 1.0]
      lambda_l1: [0.0, 10.0]
      lambda_l2: [0.0, 10.0]
