# Metadata & Identifiers (not model features)
identifiers:
  - code_module
  - code_presentation
  - id_student
  - week
  - split

# Target variables (for training/evaluation targets, not model inputs)
targets:
  - label_dropout_k2
  - label_dropout_k3
  - label_dropout_k4
  - label_inactive_k2
  - label_inactive_k3
  - label_inactive_k4
  - label_inactive_persistent_k2
  - label_inactive_persistent_k3
  - label_inactive_persistent_k4
  - final_score
  - grade_band

# Row filtering and diagnostic flags (never model inputs)
flags:
  - is_enrolled_at_week_t
  - is_post_assessment_period
  - is_censored_k2
  - is_censored_k3
  - is_censored_k4
  - label_is_proxy
  - never_active_learner
  - is_zero_click_withdrawal
  - effective_date_unregistration
